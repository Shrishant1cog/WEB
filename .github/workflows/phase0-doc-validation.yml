name: Phase 0 documentation validation

on:
  push:
    branches:
      - main
      - phase-0/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-phase0:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Phase 0 documents
        run: node scripts/validate-phase0.mjs
