name: Flutter Build Minimal

on:
  push:
    branches: [agent/fft-development]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        working-directory: ./apps/mobile

      - name: Test
        run: flutter test
        working-directory: ./apps/mobile