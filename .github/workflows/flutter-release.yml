name: Flutter Production Release

# Manual production release only. Requires repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   SUPABASE_URL, SUPABASE_ANON_KEY
#   GOOGLE_SERVICES_JSON (base64-encoded google-services.json)
# This workflow is never triggered by ordinary pushes, so development CI does
# not depend on production signing material.

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type RELEASE to confirm an unsigned/incorrectly signed build must fail'
        required: true
        default: ''

jobs:
  release:
    name: Flutter - Release APK (production signing)
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_release == 'RELEASE'
    env:
      # These are passed to Flutter via --dart-define
      # SUPABASE_SERVICE_ROLE_KEY is intentionally NOT passed to Flutter
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      FLUTTER_DEBUG: "false"
      FFT_ENABLE_PUSH: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "BLOCKED: required secrets are not configured:$missing"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Create key.properties and keystore
        working-directory: ./apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
          cat > key.properties <<EOF
          storeFile=keystore/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          test -s app/keystore/release.keystore
          test -s key.properties

      - name: Decode google-services.json
        working-directory: ./apps/mobile/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
          test -s google-services.json
          # Verify it's valid JSON and has expected structure
          cat google-services.json | jq -e '.project_info.project_id' > /dev/null
          echo "google-services.json decoded and validated"

      - name: Build release APK (production signing required)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=FLUTTER_DEBUG=false \
            --dart-define=FFT_ENABLE_PUSH=false
        working-directory: ./apps/mobile

      - name: Verify release APK signing certificate
        working-directory: ./apps/mobile
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "BLOCKED: apksigner not found in the Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Fail if debug signing detected
        working-directory: ./apps/mobile
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)
          if echo "$CERT_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "FAIL: Release APK is signed with the Android debug certificate."
            echo "$CERT_OUTPUT"
            exit 1
          fi
          echo "PASS: release APK is not signed with the debug certificate."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Remove signing material and google-services.json
        if: always()
        working-directory: ./apps/mobile/android
        run: |
          rm -f key.properties app/keystore/release.keystore
          rm -f app/google-services.json