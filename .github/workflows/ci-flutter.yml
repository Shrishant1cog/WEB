name: CI - Flutter

on:
  push:
    branches: [agent/fft-development]
  pull_request:
    branches: [agent/fft-development]

jobs:
  flutter:
    name: Flutter - Analyze, Test, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build release APK (production signing required)
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/fft-development'
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload release APK artifact (production signed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/fft-development'
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7