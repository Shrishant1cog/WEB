name: Database Tests

on:
  push:
    branches: [agent/fft-development]
  pull_request:
    branches: [agent/fft-development]
  workflow_dispatch:

jobs:
  db-tests:
    name: Database Tests - Phase 3, 4, 5
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Use local Supabase stack for testing
      # This mirrors the local development setup
      supabase:
        image: supabase/postgres:15.8.1.062
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SUPABASE_URL: http://localhost:54321
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
          run_install: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: '2.20.0'

      - name: Start Supabase local stack
        run: |
          cd supabase
          supabase start
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64

      - name: Wait for Supabase to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:54321/health >/dev/null; do sleep 2; done'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/web

      - name: Run Phase 3 RPC tests
        run: node scripts/phase3-rpc-check.mjs
        working-directory: ./apps/web

      - name: Run Phase 3 Security tests
        run: node scripts/phase3-security-check.mjs
        working-directory: ./apps/web

      - name: Run Phase 4 tests
        run: node scripts/phase4-rpc-check.mjs
        working-directory: ./apps/web

      - name: Run Phase 5 tests
        run: node scripts/phase5-rpc-check.mjs
        working-directory: ./apps/web

      - name: Stop Supabase
        if: always()
        run: |
          cd supabase && supabase stop