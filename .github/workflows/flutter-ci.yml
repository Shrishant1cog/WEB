name: Flutter CI

# Development CI only. This workflow never touches production signing
# secrets, so a missing keystore can never fail ordinary development tests.
# Production signing lives in flutter-release.yml (manual dispatch).

on:
  push:
    branches: [agent/fft-development]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter - Analyze, Test, Build (debug)
    runs-on: ubuntu-latest
    env:
      # Explicitly limit Gradle heap for CI runner (7 GB total)
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m"
      # Disable Gradle daemon to avoid memory accumulation across steps
      GRADLE_DAEMON: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./apps/mobile

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos
        working-directory: ./apps/mobile

      - name: Run tests
        run: flutter test
        working-directory: ./apps/mobile

      - name: Build debug APK (QA signing)
        run: flutter build apk --debug --no-pub
        working-directory: ./apps/mobile

      - name: Upload debug APK artifact (QA)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
