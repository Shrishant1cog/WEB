name: fft_mobile
description: FFT - Independent Free Fire India Tournament Management Platform (Mobile)
version: 0.1.0+1
publish_to: 'none'

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^3.0.0
  dartz: ^0.10.1

  # State Management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0

  # Dependency Injection
  get_it: ^9.3.0
  injectable: ^3.0.0

  # Navigation
  go_router: ^18.1.3

  # Supabase
  supabase_flutter: ^2.5.6

  # Secure Storage
  flutter_secure_storage: ^11.2.0

  # Network
  dio: ^5.7.0
  connectivity_plus: ^7.3.2

  # Utilities
  intl: ^0.20.3
  uuid: ^4.5.1
  path_provider: ^2.1.0
  url_launcher: ^6.3.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0

  # UI
  material_symbols_icons: ^4.2900.0
  cached_network_image: ^4.0.6
  photo_view: ^0.15.0
  flutter_svg: ^2.0.17

  # Permissions
  permission_handler: ^13.0.2

  # Logging
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.1
  json_serializable: ^6.8.0
  injectable_generator: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/