# Supabase local configuration
project_id = "fft-local"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
port = 54323

[inbucket]
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["fft://auth/callback", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
min_password_length = 8
password_strength_enabled = true
email_confirm_required = true
enable_email_autoconfirm = false
enable_email_change_confirm = true
enable_phone_autoconfirm = false
enable_phone_signup = false
enable_phone_signin = false
max_frequent_signup_attempts = 3
rate_limit_email_sent = 3
rate_limit_sms_sent = 3
rate_limit_token_refresh = 10

[auth.external]
google_enabled = false
apple_enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[edge_runtime]
enabled = true